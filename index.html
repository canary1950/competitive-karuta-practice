<body><div class="wrap"><h1>競技かるた 練習特化版</h1>
<section id="home" class="panel"><h2>100首・決まり字練習</h2><div class="grid">
<label>練習モード<select id="mode"><option value="kim">決まり字反応練習</option><option value="live">実戦・上の句逐次表示</option><option value="full">上の句反応練習</option><option value="weak">苦手札反復</option></select></label>
<label>決まり字<select id="group"><option value="all">1〜6字すべて</option><option value="1">1字決まり（7首）</option><option value="2">2字決まり（42首）</option><option value="3">3字決まり（37首）</option><option value="4">4字決まり（6首）</option><option value="5">5字決まり（2首）</option><option value="6">6字決まり（6首）</option></select></label>
<label>問題数<select id="count"><option>10</option><option>20</option><option>30</option><option>50</option><option>100</option></select></label>
<label>選択肢<select id="choices"><option>4</option><option>6</option><option>8</option></select></label>
<label>音声<select id="speech"><option value="on">読み上げ ON</option><option value="off">読み上げ OFF</option></select></label>
<label>読み速度<select id="rate"><option value="0.75">ゆっくり</option><option value="0.9" selected>標準</option><option value="1.05">速め</option></select></label></div>
<div class="row"><button class="primary" id="start">練習開始</button><button class="secondary" id="listBtn">100首一覧</button></div>
<p class="small">「実戦・上の句逐次表示」では上の句を読み上げながら文字を表示します。決まり字に達すると「今！」＋短い音で合図し、その瞬間から0.01秒単位で反応時間を測ります。回答後は決まり字を赤、残りを黒で全文確認できます。</p></section>
<section id="practice" class="panel hidden"><div class="stats"><div class="stat">問題<b id="prog"></b></div><div class="stat">正解<b id="ok">0</b></div><div class="stat">お手つき<b id="ng">0</b></div><div class="stat">平均反応<b id="avg">-</b></div></div>
<div class="reading" id="prompt"></div><div class="cards" id="cards"></div><div id="fb" class="feedback hidden"></div>
<div class="row"><button id="next" class="primary hidden">次の問題</button><button id="back" class="secondary">ホーム</button></div></section>
<section id="finish" class="panel hidden"><h2>結果</h2><div id="final" class="reading"></div><div class="row"><button id="retry" class="primary">もう一度</button><button id="finishBack" class="secondary">ホーム</button></div></section>
<section id="list" class="panel hidden"><h2>100首一覧</h2><div id="all"></div><div class="row"><button id="listBack" class="secondary">ホーム</button></div></section></div>

const $=id=>document.getElementById(id), screens=["home","practice","finish","list"];let q=[],i=0,cur=null,oks=0,ngs=0,times=[],t0=0,answered=false;
function show(x){screens.forEach(s=>$(s).classList.add("hidden"));$(x).classList.remove("hidden")}
function shuffle(a){a=[...a];for(let n=a.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}
function pool(){let a=$("group").value==="all"?poems:poems.filter(p=>p.g===$("group").value);if($("mode").value==="weak"){let w=a.filter(p=>p.mistakes);if(w.length)a=w.sort((a,b)=>b.mistakes-a.mistakes)}return a}
function stats(){$("prog").textContent=`${Math.min(i+1,q.length)} / ${q.length}`;$("ok").textContent=oks;$("ng").textContent=ngs;$("avg").textContent=times.length?(times.reduce((a,b)=>a+b,0)/times.length/1000).toFixed(2)+"秒":"-"}
function start(){let p=pool();q=shuffle(p).slice(0,Math.min(+$("count").value,p.length));i=oks=ngs=0;times=[];show("practice");question()}
function question(){if(i>=q.length)return done();cur=q[i];answered=false;$("fb").classList.add("hidden");$("next").classList.add("hidden");let live=$("mode").value==="live";$("prompt").className="reading"+(live?" livebox":"");$("prompt").textContent=live?"まもなく読み始めます…":($("mode").value==="kim"?cur.k:cur.yomi);$("cards").innerHTML="";let n=+$("choices").value, arr=shuffle([cur,...shuffle(poems.filter(p=>p.id!==cur.id)).slice(0,n-1)]);arr.forEach(p=>{let b=document.createElement("button");b.className="choice";b.textContent=p.shimo;b.disabled=live;b.onclick=()=>answer(b,p);$("cards").appendChild(b)});stats();if(live)startLive();else t0=Date.now()}
function highlighted(p){let y=p.yomi.replaceAll(" ","");return `<span class="kim">${y.slice(0,p.k.length)}</span><span class="rest">${y.slice(p.k.length)}</span>`}
let liveTimer=null,liveStart=0,kimTime=0,utter=null;
function nowMs(){return (window.performance&&performance.now)?performance.now():Date.now()}
function stopLive(){if(liveTimer){clearTimeout(liveTimer);liveTimer=null}if("speechSynthesis" in window){speechSynthesis.cancel()}utter=null}
function beep(){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.08);o.start();o.stop(c.currentTime+.08);setTimeout(()=>c.close(),180)}catch(e){}}
function speakKami(){if($("speech").value!=="on"||!("speechSynthesis" in window))return;utter=new SpeechSynthesisUtterance(cur.yomi.replaceAll(" ",""));utter.lang="ja-JP";utter.rate=+$("rate").value;utter.pitch=1;utter.volume=1;speechSynthesis.cancel();speechSynthesis.speak(utter)}
function startLive(){
 stopLive(); let y=cur.yomi.replaceAll(" ",""), pos=0;
 const interval=360, lead=900;
 liveTimer=setTimeout(()=>{if(answered)return; speakKami();
   function tick(){
    if(answered)return;
    pos++;
    let a=y.slice(0,Math.min(pos,cur.k.length)), b=y.slice(cur.k.length,pos);
    let cue=pos===cur.k.length?'<span class="cue">今！</span>':'';
    $("prompt").innerHTML=`<span class="live-kim">${a}</span><span class="live-rest">${b}</span>${cue}`;
    if(pos===cur.k.length){kimTime=nowMs();t0=kimTime;beep();[...$("cards").children].forEach(x=>x.disabled=false)}
    if(pos<y.length)liveTimer=setTimeout(tick,interval);
   } tick();
 },lead);
}
function answer(btn,p){if(answered)return;stopLive();answered=true;let t=nowMs()-t0;times.push(t);cur.attempts++;[...$("cards").children].forEach(b=>{b.disabled=true;if(b.textContent===cur.shimo)b.classList.add("correct")});let good=p.id===cur.id;if(good){oks++;btn.classList.add("correct")}else{ngs++;cur.mistakes++;btn.classList.add("wrong")}$("fb").innerHTML=`<b>${good?"✅ 正解":"❌ お手つき"}</b>　反応 ${(t/1000).toFixed(2)}秒<br><div class="full-yomi">${highlighted(cur)}</div><div><b>上の句：</b>${cur.kami}</div><div><b>取り札：</b>${cur.shimo}</div><div class="small">${cur.g}字決まり「${cur.k}」</div>`;$("fb").classList.remove("hidden");$("next").classList.remove("hidden");stats()}
function done(){stopLive();let av=times.length?(times.reduce((a,b)=>a+b,0)/times.length/1000).toFixed(2):"-";$("final").innerHTML=`${q.length}問中 ${oks}問正解<br>お手つき ${ngs}回<br>平均反応 ${av}秒`;show("finish")}
function list(){$("all").innerHTML=poems.map(p=>`<div class="poem"><b>${p.id}番　${p.g}字決まり</b><div class="full-yomi">${highlighted(p)}</div><div>${p.shimo}</div></div>`).join("");show("list")}
console.assert(poems.length===100,"100首を収録");const expected={"1":7,"2":42,"3":37,"4":6,"5":2,"6":6};for(const g in expected)console.assert(poems.filter(p=>p.g===g).length===expected[g],`${g}字決まり件数`);console.assert(new Set(poems.map(p=>p.id)).size===100,"ID重複なし");console.assert(poems.every(p=>p.k&&p.kami&&p.yomi&&p.shimo&&p.yomi.replaceAll(" ","").startsWith(p.k)),"決まり字は読みの先頭");
